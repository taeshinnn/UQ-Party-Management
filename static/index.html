<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UQ Party Queue Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 UQ Party Queue Manager</h1>
            <p class="subtitle">Organize your quest parties automatically</p>
        </header>

        <div class="main-content">
            <!-- Add Players Section -->
            <section class="add-section">
                <h2>Add Players</h2>
                <div class="add-controls">
                    <input type="text" id="playerName" placeholder="Enter player name..." />
                    <button onclick="addPlayer()" class="btn btn-primary">Add +1</button>
                    <button onclick="addMultiple(2)" class="btn btn-secondary">+2</button>
                    <button onclick="addMultiple(3)" class="btn btn-secondary">+3</button>
                </div>
                <div class="add-multiple">
                    <textarea id="multipleNames" placeholder="Or paste multiple names (one per line or comma-separated)"></textarea>
                    <button onclick="addMultipleFromText()" class="btn btn-primary">Add All</button>
                </div>
            </section>

            <!-- Queue Status Section -->
            <section class="queue-section">
                <div class="queue-header">
                    <h2>Current Queue</h2>
                    <div class="queue-count">
                        <span id="queueCount">0</span>/<span id="maxPlayers">8</span> players
                    </div>
                </div>
                
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                    <span id="progressText" class="progress-text">0%</span>
                </div>

                <div id="queueList" class="queue-list">
                    <p class="empty-message">No players in queue yet</p>
                </div>

                <div class="queue-actions">
                    <button onclick="clearQueue()" class="btn btn-danger">Clear Queue</button>
                </div>
            </section>

            <!-- Parties Section -->
            <section id="partiesSection" class="parties-section" style="display: none;">
                <h2>🎉 Quest Group Ready!</h2>
                <div id="partiesContainer" class="parties-container"></div>
                <div class="party-actions">
                    <button onclick="copyParties()" class="btn btn-primary">📋 Copy to Clipboard</button>
                    <button onclick="finalizeParties()" class="btn btn-success">✅ Start New Queue</button>
                </div>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <h2>Recent Parties</h2>
                <div id="historyList" class="history-list">
                    <p class="empty-message">No party history yet</p>
                </div>
            </section>
        </div>

        <footer>
            <div class="status" id="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </footer>
    </div>
